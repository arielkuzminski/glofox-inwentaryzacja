# Wdrożenie panelu na GitHub Pages. Menadżer klubu dostaje link zamiast instrukcji
# „zainstaluj Node i odpal npm run dev".
#
# Testy są BRAMKĄ: czerwony build nie trafia na produkcję. Testy na realnych danych
# (src/ui/__tests__/realdata.test.tsx) same się pomijają, bo real_data/ jest w .gitignore.
name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jeden deploy naraz; nowszy push czeka, zamiast wyścigu o Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
